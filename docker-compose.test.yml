version: '3.8'

services:
  test-db:
    image: postgres:16-alpine
    container_name: tungthien-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test_password_local
      POSTGRES_DB: tungthien_test
    ports:
      - '5433:5432'
    volumes:
      - test_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  test_pg_data:
