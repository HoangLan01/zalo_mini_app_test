name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  NODE_VERSION: 20
  FRONTEND_NPM_VERSION: 11.7.0

jobs:
  validate_deploy_config:
    name: Validate Deploy Config
    runs-on: ubuntu-latest
    outputs:
      frontend_ready: ${{ steps.validate.outputs.frontend_ready }}
      admin_ready: ${{ steps.validate.outputs.admin_ready }}
      backend_ready: ${{ steps.validate.outputs.backend_ready }}
    steps:
      - id: validate
        shell: bash
        run: |
          frontend_ready=true
          admin_ready=true
          backend_ready=true

          if [[ -z "${{ secrets.SSH_HOST }}" || -z "${{ secrets.SSH_USER }}" || -z "${{ secrets.SSH_PRIVATE_KEY }}" ]]; then
            frontend_ready=false
            admin_ready=false
            backend_ready=false
            echo "Missing shared SSH deploy secrets." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ -z "${{ secrets.DEPLOY_FRONTEND_DIR }}" ]]; then
            frontend_ready=false
            echo "Frontend deploy skipped: missing DEPLOY_FRONTEND_DIR." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ -z "${{ secrets.DEPLOY_ADMIN_DIR }}" ]]; then
            admin_ready=false
            echo "Admin deploy skipped: missing DEPLOY_ADMIN_DIR." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ -z "${{ secrets.DEPLOY_BACKEND_DIR }}" ]]; then
            backend_ready=false
            echo "Backend deploy skipped: missing DEPLOY_BACKEND_DIR." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ -z "${{ vars.PROD_API_URL }}" ]]; then
            frontend_ready=false
            admin_ready=false
            echo "Static builds skipped: missing repository variable PROD_API_URL." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ -z "${{ vars.PROD_ZALO_OA_ID }}" ]]; then
            frontend_ready=false
            echo "Frontend deploy skipped: missing repository variable PROD_ZALO_OA_ID." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "frontend_ready=$frontend_ready" >> "$GITHUB_OUTPUT"
          echo "admin_ready=$admin_ready" >> "$GITHUB_OUTPUT"
          echo "backend_ready=$backend_ready" >> "$GITHUB_OUTPUT"

  deploy_frontend:
    name: Deploy Frontend
    needs: validate_deploy_config
    if: ${{ needs.validate_deploy_config.outputs.frontend_ready == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use frontend npm version
        run: npm install --global npm@${{ env.FRONTEND_NPM_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.PROD_API_URL }}
          VITE_ZALO_OA_ID: ${{ vars.PROD_ZALO_OA_ID }}

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add SSH host key
        run: ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}

      - name: Sync frontend files
        run: rsync -az --delete www/ "$SSH_USER@$SSH_HOST:$DEPLOY_FRONTEND_DIR/"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_FRONTEND_DIR: ${{ secrets.DEPLOY_FRONTEND_DIR }}

  deploy_admin:
    name: Deploy Admin
    needs: validate_deploy_config
    if: ${{ needs.validate_deploy_config.outputs.admin_ready == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build admin
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.PROD_API_URL }}

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add SSH host key
        run: ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}

      - name: Sync admin files
        run: rsync -az --delete dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_ADMIN_DIR/"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_ADMIN_DIR: ${{ secrets.DEPLOY_ADMIN_DIR }}

  deploy_backend:
    name: Deploy Backend
    needs: validate_deploy_config
    if: ${{ needs.validate_deploy_config.outputs.backend_ready == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build backend
        run: npm run build

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add SSH host key
        run: ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}

      - name: Sync backend release
        run: >
          rsync -az --delete
          dist prisma package.json package-lock.json ecosystem.config.js
          "$SSH_USER@$SSH_HOST:$DEPLOY_BACKEND_DIR/"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_BACKEND_DIR: ${{ secrets.DEPLOY_BACKEND_DIR }}

      - name: Install and restart backend
        run: >
          ssh "$SSH_USER@$SSH_HOST"
          "cd '$DEPLOY_BACKEND_DIR'
          && npm ci --omit=dev
          && npx prisma generate
          && npx prisma migrate deploy
          && pm2 startOrReload ecosystem.config.js --update-env"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_BACKEND_DIR: ${{ secrets.DEPLOY_BACKEND_DIR }}
